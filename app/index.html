<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         values under the iPhone notch / Android gesture bar. AppShell.vue
         relies on it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0f172a" />
    <!-- Favicon: the Huntima mark as SVG, so it stays crisp at every tab size
         and inlines as one tiny file. Files live in app/public/, which Vite
         serves at the web root. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The product's display face (titles, badges, celebrations). Loaded for
         every tenant, so it belongs here rather than being injected by JS: the
         browser's preload scanner finds it while parsing this file, instead of
         after the bundle has downloaded, parsed and run. That is a round trip
         earlier on the stadium wifi this app is designed around. Bagel Fat One
         ships a single 400 weight, so there is no wght axis to request; see
         src/lib/fonts.ts, which owns the per-tenant faces. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap"
    />
    <meta name="description" content="Collect badges around the event and claim your prize." />
    <title>Huntima</title>
  </head>
  <body>
    <!-- The fan app's tinted ground.
         It lives HERE, in the document, rather than inside a Vue component,
         because of when it has to be visible. As a component it could not
         exist until the router's async guard had resolved a session and
         fetched a brand — several hundred milliseconds after first paint —
         so every cold load showed a flat near-white page and then snapped to
         a gradient. Easing that in would only have made a late arrival
         graceful; the fix is to not be late.

         Painted from CSS (#app-backdrop in main.css) using the brand tokens,
         which the tenant store writes onto <html> synchronously before first
         paint. So it is already the club's colors, not a default that
         changes under the fan a moment later.

         The console and the signed-out pages cover it with their own opaque
         full-bleed background — this is the FAN shell's ground, and they are
         not it. -->
    <div id="app-backdrop" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
